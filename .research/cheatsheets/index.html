<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chezmoi Cheatsheets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/dark.css" media="(prefers-color-scheme: dark)">
</head>
<body>
  <div id="app"></div>
  <script>
    window.renderMermaid = async () => {
      if (!window.mermaidLoader) {
        window.mermaidLoader = import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')
          .then((module) => {
            const mermaid = module.default;
            mermaid.initialize({
              startOnLoad: false,
              securityLevel: 'loose',
              flowchart: { htmlLabels: true },
            });
            return mermaid;
          });
      }

      const mermaid = await window.mermaidLoader;
      await mermaid.run({
        nodes: document.querySelectorAll('.mermaid'),
        suppressErrors: true,
      });
    };

    window.$docsify = {
      name: 'Chezmoi Cheatsheets',
      loadSidebar: true,
      homepage: 'INDEX.md',
      search: {
        placeholder: 'Search cheatsheets...',
        noData: 'No results',
      },
      plugins: [
        function(hook) {
          hook.afterEach(function(html, next) {
            const withMermaid = html.replace(
              /<pre[^>]*><code class="(?:lang|language)-mermaid">([\s\S]*?)<\/code><\/pre>/g,
              function(_, code) {
                const withLineBreaks = code.replace(/&(amp;)?lt;br\s*\/?&(amp;)?gt;/gi, '<br/>');
                return `<pre class="mermaid">${withLineBreaks}</pre>`;
              }
            );
            next(withMermaid);
          });

          hook.doneEach(function() {
            window.renderMermaid();
          });
        },
      ],
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Prism syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-vim.min.js"></script>
</body>
</html>
